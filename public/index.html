<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusConnect — Discover Campus Events</title>
  <meta name="description" content="Browse, search and register for workshops, hackathons and cultural events on campus." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="container my-4">
    <section class="cc-hero mb-4" aria-labelledby="hero-title">
      <div class="col-lg-8">
        <h1 id="hero-title">Everything happening on campus, in one place.</h1>
        <p class="lead mb-0">Find workshops, hackathons, talks and cultural nights — and reserve your seat in seconds.</p>
      </div>
    </section>

    <!-- Search + filter: Feature 1 (Student 1) -->
    <section aria-labelledby="browse-title">
      <h2 id="browse-title" class="h4 mb-3">Browse events</h2>

      <form id="filterForm" class="row g-2 align-items-end mb-4" role="search" aria-label="Filter events">
        <div class="col-sm-6 col-lg-5">
          <label for="search" class="form-label">Search</label>
          <input type="search" id="search" name="search" class="form-control"
                 placeholder="Title, organizer or keyword…" autocomplete="off" />
        </div>
        <div class="col-sm-4 col-lg-3">
          <label for="category" class="form-label">Category</label>
          <select id="category" name="category" class="form-select">
            <option value="">All categories</option>
            <option>Workshop</option>
            <option>Hackathon</option>
            <option>Cultural</option>
            <option>Seminar</option>
            <option>Sports</option>
          </select>
        </div>
        <div class="col-sm-2 col-lg-2">
          <button type="reset" id="resetBtn" class="btn btn-outline-secondary w-100">Reset</button>
        </div>
      </form>

      <p id="resultCount" class="text-muted-2" role="status" aria-live="polite"></p>

      <div id="eventGrid" class="row g-4" aria-busy="true">
        <!-- cards injected by home.js -->
      </div>

      <div id="emptyState" class="text-center py-5 d-none">
        <p class="h5">No events match your search.</p>
        <p class="text-muted-2">Try a different keyword or category.</p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
