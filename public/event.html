<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event details — CampusConnect</title>
  <meta name="description" content="View event details and register for a campus event." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="container my-4">
    <nav aria-label="Breadcrumb">
      <a href="index.html" class="text-decoration-none">← Back to all events</a>
    </nav>

    <div id="eventDetail" aria-live="polite" class="mt-3">
      <p>Loading event…</p>
    </div>
  </main>

  <!-- Registration modal: Feature 2 (Student 1) -->
  <div class="modal fade" id="regModal" tabindex="-1" aria-labelledby="regModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="regForm" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="regModalLabel">Register for this event</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="regAlert" class="alert d-none" role="alert"></div>

            <div class="mb-3">
              <label for="r-name" class="form-label">Full name</label>
              <input type="text" class="form-control" id="r-name" name="name" required minlength="2" autocomplete="name" />
              <div class="field-error" data-error-for="name"></div>
            </div>
            <div class="mb-3">
              <label for="r-email" class="form-label">Email</label>
              <input type="email" class="form-control" id="r-email" name="email" required autocomplete="email" />
              <div class="field-error" data-error-for="email"></div>
            </div>
            <div class="row">
              <div class="col-sm-7 mb-3">
                <label for="r-reg" class="form-label">Registration number</label>
                <input type="text" class="form-control" id="r-reg" name="reg_no" required
                       pattern="[A-Za-z0-9]{6,15}" />
                <div class="field-error" data-error-for="reg_no"></div>
              </div>
              <div class="col-sm-5 mb-3">
                <label for="r-year" class="form-label">Year</label>
                <select class="form-select" id="r-year" name="year" required>
                  <option value="">Select…</option>
                  <option value="1">1st</option>
                  <option value="2">2nd</option>
                  <option value="3">3rd</option>
                  <option value="4">4th</option>
                </select>
                <div class="field-error" data-error-for="year"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="regSubmit">Confirm registration</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/event.js"></script>
</body>
</html>
