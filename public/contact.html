<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — CampusConnect</title>
  <meta name="description" content="Get in touch with the CampusConnect team." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="container my-4">
    <div class="row justify-content-center g-4">
      <div class="col-lg-5">
        <h1 class="h3">Contact us</h1>
        <p class="text-muted-2">Questions, feedback or want your club listed? Send us a message.</p>
        <ul class="list-unstyled small">
          <li class="mb-2">📧 <a href="mailto:hello@campusconnect.test">hello@campusconnect.test</a></li>
          <li class="mb-2">📍 School of Computer Engineering, MIT Manipal</li>
        </ul>
      </div>

      <div class="col-lg-7">
        <div class="cc-form-card p-4">
          <div id="contactAlert" class="alert d-none" role="alert"></div>
          <form id="contactForm" novalidate>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="c-name" class="form-label">Name</label>
                <input type="text" class="form-control" id="c-name" name="name" required minlength="2" autocomplete="name" />
                <div class="field-error" data-error-for="name"></div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="c-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="c-email" name="email" required autocomplete="email" />
                <div class="field-error" data-error-for="email"></div>
              </div>
            </div>
            <div class="mb-3">
              <label for="c-subject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="c-subject" name="subject" required minlength="3" />
              <div class="field-error" data-error-for="subject"></div>
            </div>
            <div class="mb-3">
              <label for="c-body" class="form-label">Message</label>
              <textarea class="form-control" id="c-body" name="body" rows="4" required minlength="10"></textarea>
              <div class="field-error" data-error-for="body"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="contactSubmit">Send message</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
